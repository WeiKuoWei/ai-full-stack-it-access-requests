[project]
name = "access-intake"
version = "0.1.0"
description = "Language-model intake for Northstar Labs IT access requests: extraction, validation, review queue."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.32.0",
    "anthropic[vertex]>=2.1.0",
    "jsonschema>=4.23",
]

[project.scripts]
access-intake = "access_intake.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/access_intake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
